name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install tools
        run: python -m pip install flake8 mypy "pyright==1.1.414"
      - name: flake8
        run: flake8 text_converters/ tests/ --max-line-length=127 --max-complexity=10
      - name: mypy (strict)
        run: mypy
      - name: pyright (strict)
        run: pyright

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install tools
        run: python -m pip install black isort
      - name: black
        run: black --check text_converters/ tests/
      - name: isort
        run: isort --check-only text_converters/ tests/

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest tests/ -v --cov=text_converters --cov-branch --cov-report=term-missing
