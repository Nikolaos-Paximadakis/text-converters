name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no upload token is stored anywhere.
# - Running this workflow by hand uploads to TestPyPI (a rehearsal).
# - Publishing a GitHub release whose tag is vX.Y.Z uploads to PyPI; the tag must match
#   the version in pyproject.toml and text_converters/__init__.py.
# PyPI never accepts the same filename twice: after any change, bump the version.
# Rollback means yanking the release on PyPI and publishing a fixed version.
#
# One-time setup:
#   1. pypi.org and test.pypi.org -> Publishing -> add a pending publisher: project
#      text-converters, owner Nikolaos-Paximadakis, repository text-converters,
#      workflow release.yml, environment `pypi` (TestPyPI: `testpypi`).
#   2. GitHub -> Settings -> Environments: `pypi` (deployment tags v*, required
#      reviewer) and `testpypi` (main branch only).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint, type check and test before publishing
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy
          uv run --no-sync pyright
          uv run --no-sync pytest

      - run: uv build --out-dir dist

      - run: uvx twine check --strict dist/*

      - name: Check archive contents, versions and (on release) the tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            uv run --no-project python scripts/check_dist.py dist --tag "${GITHUB_REF_NAME}"
          else
            uv run --no-project python scripts/check_dist.py dist
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/text-converters
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # No skip-existing: a rehearsal of a version that is already on TestPyPI must fail
      # loudly instead of silently keeping the older files.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/text-converters
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
