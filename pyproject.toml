[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text_converters"
version = "0.1.0"
authors = [
    {name = "Nikos Paximadakis"},
]
description = "Convert Greek, Swedish, German, French and Spanish letters to plain Latin equivalents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nikolaos-Paximadakis/text-converters"
Issues = "https://github.com/Nikolaos-Paximadakis/text-converters/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["text_converters*"]

[tool.setuptools.package-data]
text_converters = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["text_converters"]

[tool.pyright]
include = ["text_converters"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
