[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text_converters"
version = "0.2.1"
authors = [
    {name = "Nikos Paximadakis"},
]
description = "Convert Greek, Swedish, German, French and Spanish letters to plain Latin equivalents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["transliteration", "greek", "elot-743", "diacritics", "ascii", "unicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nikolaos-Paximadakis/text-converters"
Repository = "https://github.com/Nikolaos-Paximadakis/text-converters"
Issues = "https://github.com/Nikolaos-Paximadakis/text-converters/issues"
Changelog = "https://github.com/Nikolaos-Paximadakis/text-converters/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["text_converters*"]

[tool.setuptools.package-data]
text_converters = ["py.typed"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]  # README examples are documentation, not code to reformat

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",        # syntax, undefined names, unused imports
    "B",                          # bugbear: mutable defaults, zip strict, loop closures
    "S",                          # security, incl. assert used as a guard
    "DTZ",                        # naive datetimes
    "RUF", "SIM", "PERF",         # correctness-adjacent idioms; RUF100 prunes stale noqa
    "I", "UP",                    # import order, modern syntax
    "T20", "ERA",                 # stray prints, commented-out code
    "PTH",                        # pathlib
    "FBT",                        # boolean positional arguments
]
# Not selected on purpose: ANN (the type checkers cover it), PL and C90 (style and
# complexity counts, not defects), E501 (long explanatory comments are fine).

[tool.ruff.lint.per-file-ignores]
# Greek letters that look like Latin ones are the point of this package.
"text_converters/character_converters.py" = ["RUF001", "RUF002", "RUF003"]
# pytest asserts and parametrized flags; Greek test input.
"tests/**" = ["S101", "FBT", "RUF001", "RUF002", "RUF003"]
# A command-line check: its output is the result.
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["text_converters", "tests", "scripts"]

[tool.pyright]
include = ["text_converters", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false  # an ignore must name its rule: # pyright: ignore[rule]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true
